<!doctype html>
<html lang="es-DO">
<head>
<meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Sin conexión</title>
<style>
  :root { --bg: #f4f6fa; --fg: #0f172a; --muted: #64748b; }
  @media (prefers-color-scheme: dark) { :root { --bg: #0b1220; --fg: #e2e8f0; --muted: #94a3b8; } }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--fg); font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; text-align: center; padding: 16px; }
  p { color: var(--muted); max-width: 32ch; margin: 8px auto 20px; }
  button { font: inherit; padding: 10px 18px; border-radius: 10px; border: 0; background: #2f80ed; color: #fff; }
</style>
</head>
<body>
  <main>
    <img src="/icons/icon.svg" width="72" height="72" alt="" />
    <h1>Sin conexión</h1>
    <p>No hay internet en este momento. Cuando vuelva la conexión, la información se actualizará automáticamente.</p>
    <button onclick="location.reload()">Reintentar</button>
  </main>
</body>
</html>
